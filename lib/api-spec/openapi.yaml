openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScholarMate API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scholarships
    description: Public scholarship catalogue operations
  - name: admin
    description: Admin-only scholarship data management operations
  - name: student
    description: Authenticated student profile operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------------
  # Public catalogue
  # ---------------------------------------------------------------------

  /scholarships:
    get:
      operationId: listScholarships
      tags: [scholarships]
      summary: List scholarships
      description: Returns a paginated list of published, active scholarships with optional filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Keyword search across title, description, eligibility summary, and provider name
        - name: categoryId
          in: query
          schema:
            type: number
          description: Filter by category
        - name: state
          in: query
          schema:
            type: string
          description: Filter by state (e.g. Maharashtra, National)
        - name: providerId
          in: query
          schema:
            type: number
          description: Filter by a specific provider
        - name: providerType
          in: query
          schema:
            type: string
            enum: [govt, ngo, private, university]
          description: Filter by provider type
        - name: courseLevel
          in: query
          schema:
            type: string
            enum: [School, Diploma, UG, PG, PhD, Any]
          description: Filter by education level
        - name: courseStream
          in: query
          schema:
            type: string
          description: Filter by specific course/stream (e.g. B.Tech, MBBS)
        - name: gender
          in: query
          schema:
            type: string
            enum: [any, male, female, other]
          description: Filter by gender eligibility
        - name: maxFamilyIncome
          in: query
          schema:
            type: number
            minimum: 0
          description: Student's annual family income (INR); returns scholarships with no income cap or a cap at or above this value
        - name: academicPercentage
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
          description: Student's academic percentage; returns scholarships with no minimum or a minimum at or below this value
        - name: deadlineWithinDays
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 3650
          description: Only include scholarships whose deadline falls within this many days from today (e.g. 7, 30, 90, 365)
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [relevance, deadline_asc, amount_desc, newest]
            default: newest
          description: Sort order for results
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Paginated scholarship list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipList"

  /categories:
    get:
      operationId: listCategories
      tags: [scholarships]
      summary: List scholarship categories
      description: Returns all scholarship categories, for use in discovery filters
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /providers:
    get:
      operationId: listProviders
      tags: [scholarships]
      summary: List scholarship providers
      description: Returns all scholarship providers, for use in discovery filters
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"

  /scholarships/stats:
    get:
      operationId: getScholarshipStats
      tags: [scholarships]
      summary: Scholarship platform statistics
      description: Returns aggregate counts for the platform homepage
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipStats"

  /scholarships/{id}:
    get:
      operationId: getScholarship
      tags: [scholarships]
      summary: Get scholarship by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Scholarship detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------
  # Admin: providers
  # ---------------------------------------------------------------------

  /admin/providers:
    get:
      operationId: adminListProviders
      tags: [admin]
      summary: List all scholarship providers
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
    post:
      operationId: adminCreateProvider
      tags: [admin]
      summary: Create a scholarship provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertProvider"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate provider name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------
  # Admin: categories
  # ---------------------------------------------------------------------

  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin]
      summary: List all scholarship categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Create a scholarship category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: Duplicate category name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------
  # Admin: scholarships (core CRUD)
  # ---------------------------------------------------------------------

  /admin/scholarships:
    get:
      operationId: adminListScholarships
      tags: [admin]
      summary: List all scholarships regardless of status
      parameters:
        - name: dataStatus
          in: query
          schema:
            type: string
            enum: [draft, pending_review, published, expired, archived]
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [unverified, verified, disputed, needs_update]
      responses:
        "200":
          description: Admin scholarship list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminScholarshipList"
    post:
      operationId: adminCreateScholarship
      tags: [admin]
      summary: Create a scholarship
      description: >
        Requires at least one source with role "official". Duplicate
        detection rejects scholarships with the same title for the same
        provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScholarshipRequest"
      responses:
        "201":
          description: Scholarship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate scholarship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}:
    get:
      operationId: adminGetScholarship
      tags: [admin]
      summary: Get full scholarship detail for editing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Scholarship detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: adminUpdateScholarship
      tags: [admin]
      summary: Update scholarship fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScholarshipRequest"
      responses:
        "200":
          description: Updated scholarship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteScholarship
      tags: [admin]
      summary: Delete a scholarship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/verify:
    patch:
      operationId: adminVerifyScholarship
      tags: [admin]
      summary: Mark a scholarship's verification status
      description: >
        Setting verificationStatus to "verified" requires the scholarship to
        have at least one source with role "official" already attached.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyScholarshipRequest"
      responses:
        "200":
          description: Updated scholarship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "400":
          description: Validation error (e.g. missing official source)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/status:
    patch:
      operationId: adminSetScholarshipStatus
      tags: [admin]
      summary: Set scholarship active/inactive status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScholarshipStatusRequest"
      responses:
        "200":
          description: Updated scholarship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------
  # Admin: nested sub-resources
  # ---------------------------------------------------------------------

  /admin/scholarships/{id}/sources:
    post:
      operationId: adminAddScholarshipSource
      tags: [admin]
      summary: Add a source URL (official, information, or application role)
      description: >
        At most one "official" and one "application" role are allowed per
        scholarship; "information" allows multiple.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertScholarshipSource"
      responses:
        "201":
          description: Source added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipSource"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate source or role conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/sources/{sourceId}:
    delete:
      operationId: adminDeleteScholarshipSource
      tags: [admin]
      summary: Remove a source from a scholarship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: sourceId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/eligibility-criteria:
    post:
      operationId: adminAddEligibilityCriteria
      tags: [admin]
      summary: Add an eligibility criterion to a scholarship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertEligibilityCriteria"
      responses:
        "201":
          description: Criterion added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityCriteria"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/eligibility-criteria/{criteriaId}:
    delete:
      operationId: adminDeleteEligibilityCriteria
      tags: [admin]
      summary: Remove an eligibility criterion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: criteriaId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/documents:
    post:
      operationId: adminAddRequiredDocument
      tags: [admin]
      summary: Add a required document to a scholarship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequiredDocument"
      responses:
        "201":
          description: Document added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequiredDocument"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/scholarships/{id}/documents/{docId}:
    delete:
      operationId: adminDeleteRequiredDocument
      tags: [admin]
      summary: Remove a required document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: docId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------
  # Authenticated student profile
  # ---------------------------------------------------------------------

  /student/profile:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get the authenticated student's profile
      security:
        - clerkSession: []
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateStudentProfile
      tags: [student]
      summary: Create or update the authenticated student's profile
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileInput"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StudentProfile:
      type: object
      required:
        - id
        - fullName
        - email
        - otherAttributes
        - createdAt
        - updatedAt
      properties:
        id:
          type: number
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        college:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        course:
          type: ["string", "null"]
        educationLevel:
          type: ["string", "null"]
        academicPercentage:
          type: ["number", "null"]
        annualFamilyIncome:
          type: ["number", "null"]
        dateOfBirth:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        disabilityStatus:
          type: ["string", "null"]
        minorityCommunity:
          type: ["string", "null"]
        otherAttributes:
          type: object
          additionalProperties:
            type: ["string", "number", "boolean", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    StudentProfileInput:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        college:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        course:
          type: ["string", "null"]
        educationLevel:
          type: ["string", "null"]
        academicPercentage:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        annualFamilyIncome:
          type: ["number", "null"]
          minimum: 0
        dateOfBirth:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        disabilityStatus:
          type: ["string", "null"]
        minorityCommunity:
          type: ["string", "null"]
        otherAttributes:
          type: object
          additionalProperties:
            type: ["string", "number", "boolean", "null"]

    # -------------------------------------------------------------------
    # Providers
    # -------------------------------------------------------------------

    Provider:
      type: object
      required:
        - id
        - name
        - providerType
        - createdAt
        - updatedAt
      properties:
        id:
          type: number
        name:
          type: string
        providerType:
          type: string
          enum: [govt, ngo, private, university]
        websiteUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    InsertProvider:
      type: object
      required:
        - name
        - providerType
      properties:
        name:
          type: string
          minLength: 2
        providerType:
          type: string
          enum: [govt, ngo, private, university]
        websiteUrl:
          type: string
        description:
          type: string
        logoUrl:
          type: string

    ProviderList:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    # -------------------------------------------------------------------
    # Categories
    # -------------------------------------------------------------------

    Category:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        createdAt:
          type: string

    InsertCategory:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        icon:
          type: string

    CategoryList:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    # -------------------------------------------------------------------
    # Eligibility criteria / documents / sources
    # -------------------------------------------------------------------

    EligibilityCriteria:
      type: object
      required:
        - id
        - scholarshipId
        - criteriaType
        - operator
        - value
        - isMandatory
      properties:
        id:
          type: number
        scholarshipId:
          type: number
        criteriaType:
          type: string
          enum:
            [
              caste_category,
              gender,
              max_income,
              min_percentage,
              course_level,
              state,
              age_limit,
              disability,
              minority,
              custom,
            ]
        operator:
          type: string
          enum: [equals, not_equals, lte, gte, in, between]
        value:
          type: string
        isMandatory:
          type: boolean
        displayOrder:
          type: number

    InsertEligibilityCriteria:
      type: object
      required:
        - criteriaType
        - operator
        - value
      properties:
        criteriaType:
          type: string
          enum:
            [
              caste_category,
              gender,
              max_income,
              min_percentage,
              course_level,
              state,
              age_limit,
              disability,
              minority,
              custom,
            ]
        operator:
          type: string
          enum: [equals, not_equals, lte, gte, in, between]
        value:
          type: string
          minLength: 1
        isMandatory:
          type: boolean
          default: true
        displayOrder:
          type: number
          default: 0

    RequiredDocument:
      type: object
      required:
        - id
        - scholarshipId
        - documentName
        - isMandatory
      properties:
        id:
          type: number
        scholarshipId:
          type: number
        documentName:
          type: string
        documentDescription:
          type: ["string", "null"]
        isMandatory:
          type: boolean
        displayOrder:
          type: number

    InsertRequiredDocument:
      type: object
      required:
        - documentName
      properties:
        documentName:
          type: string
          minLength: 2
        documentDescription:
          type: string
        isMandatory:
          type: boolean
          default: true
        displayOrder:
          type: number
          default: 0

    ScholarshipSource:
      type: object
      required:
        - id
        - scholarshipId
        - sourceName
        - sourceUrl
        - sourceType
        - sourceRole
      properties:
        id:
          type: number
        scholarshipId:
          type: number
        sourceName:
          type: string
        sourceUrl:
          type: string
        sourceType:
          type: string
          enum: [official_government, institutional, ngo_direct, aggregator]
        sourceRole:
          type: string
          enum: [official, information, application]
        lastCheckedAt:
          type: ["string", "null"]

    InsertScholarshipSource:
      type: object
      required:
        - sourceName
        - sourceUrl
        - sourceType
        - sourceRole
      properties:
        sourceName:
          type: string
          minLength: 2
        sourceUrl:
          type: string
          pattern: "^https?://"
        sourceType:
          type: string
          enum: [official_government, institutional, ngo_direct, aggregator]
        sourceRole:
          type: string
          enum: [official, information, application]

    # -------------------------------------------------------------------
    # Scholarships
    # -------------------------------------------------------------------

    Scholarship:
      type: object
      required:
        - id
        - providerId
        - providerName
        - providerType
        - title
        - slug
        - description
        - eligibilitySummary
        - frequency
        - applicationMethod
        - applicationUrl
        - status
        - state
        - courseLevel
        - courseStream
        - genderEligibility
        - lastVerifiedDate
